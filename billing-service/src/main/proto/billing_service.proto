syntax ="proto3";

option java_multiple_files = true;
option java_package="billing";

service BillingService{
  rpc CreateBillingAccount(BillingRequest) returns(BillingResponse);
}

message BillingRequest{   // passing this in the rpc above (CreateBillingAccount)
  string patientId = 1;
  string name = 2 ;
  string email = 3;
}

message BillingResponse{ // this is the dummy response
  string accountId = 1;
  string status = 2;
}